<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación de Avisos de Adopción</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container">
        <h1>Evaluación de Avisos de Adopción</h1>
        
        <div class="tabla-container">
            <table class="tabla-avisos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha publicación</th>
                        <th>Sector</th>
                        <th>Cantidad</th>
                        <th>Tipo</th>
                        <th>Edad</th>
                        <th>Comuna</th>
                        <th>Nota</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="aviso : ${avisos}">
                        <td th:text="${aviso.id}">1</td>
                        <td th:text="${#temporals.format(aviso.fechaIngreso, 'yyyy-MM-dd')}">2025-06-02</td>
                        <td th:text="${aviso.sector}">Beauchef 859, terraza</td>
                        <td th:text="${aviso.cantidad}">1</td>
                        <td th:text="${aviso.tipo}">gato</td>
                        <td th:text="${aviso.edadFormateada}">2 meses</td>
                        <td th:text="${aviso.comunaNombre}">Santiago</td>
                        <td>
                            <span class="nota-promedio" 
                                  th:id="'nota-' + ${aviso.id}"
                                  th:text="${aviso.notaFormateada}">-</span>
                        </td>
                        <td>
                            <button class="btn-evaluar" 
                                    th:data-aviso-id="${aviso.id}"
                                    onclick="evaluarAviso(this)">
                                evaluar
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(avisos)}">
                        <td colspan="9" style="text-align: center;">No hay avisos disponibles</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Modal para evaluar -->
    <div id="modalEvaluar" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <h2>Evaluar Aviso</h2>
            <p>Seleccione una nota del 1 al 7:</p>
            <div class="notas-container">
                <button class="btn-nota" onclick="seleccionarNota(1)">1</button>
                <button class="btn-nota" onclick="seleccionarNota(2)">2</button>
                <button class="btn-nota" onclick="seleccionarNota(3)">3</button>
                <button class="btn-nota" onclick="seleccionarNota(4)">4</button>
                <button class="btn-nota" onclick="seleccionarNota(5)">5</button>
                <button class="btn-nota" onclick="seleccionarNota(6)">6</button>
                <button class="btn-nota" onclick="seleccionarNota(7)">7</button>
            </div>
            <div id="mensajeModal" class="mensaje"></div>
        </div>
    </div>
    
    <script th:src="@{/js/evaluaciones.js}"></script>
</body>
</html>
